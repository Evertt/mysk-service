<!doctype html>
<html
	lang="%paraglide.lang%"
	dir="%paraglide.dir%"
	data-theme="%theme%"
	data-mode="%mode%"
	class="%mode-class%"
	data-table-density="%table-density%"
	data-time-zone="%time-zone%"
>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Resolve the `system` mode before the first paint (the server can't know it).
			if (
				document.documentElement.dataset.mode === "system" &&
				matchMedia("(prefers-color-scheme: dark)").matches
			) {
				document.documentElement.classList.add("dark");
			}
			// The splash screen's safety nets (see below): it goes if the app fails to start (a script
			// that doesn't load, an error before the root layout mounts) or after 15 seconds anyway.
			(function () {
				function done() {
					var root = document.documentElement;
					root.dataset.splashDone = "";
					var app = document.getElementById("app");
					if (app) app.removeAttribute("aria-busy");
				}
				addEventListener("error", done, { once: true });
				addEventListener("unhandledrejection", done, { once: true });
				setTimeout(done, 15000);
			})();
		</script>
		<style>
			/* The splash screen: from the first paint of a full page load until the root layout has
			   mounted (`data-hydrated`, see `src/lib/splash.ts`). Its background covers the page from
			   the start, so the page never shows before it's interactive; its logo and bar fade in only
			   after 200 ms, so a fast load sees no more than a blank moment. It doesn't catch clicks
			   once it starts to fade. */
			#splash {
				position: fixed;
				inset: 0;
				z-index: 2147483000;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1.25rem;
				background: var(--background, #fff);
				color: var(--foreground, #0a0a0a);
				font-family: var(--font-sans, ui-sans-serif, system-ui, sans-serif);
				animation: splash-expire 1ms linear 15s forwards;
			}
			#splash > * {
				animation: splash-in 160ms ease-out 200ms both;
			}
			.dark #splash {
				background: var(--background, #0a0a0a);
				color: var(--foreground, #fafafa);
			}
			html[data-hydrated] #splash,
			html[data-splash-done] #splash {
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
				animation: none;
				transition:
					opacity 150ms ease-out,
					visibility 0s linear 150ms;
			}
			#splash .splash-brand {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				font-size: 1.125rem;
				font-weight: 500;
			}
			#splash .splash-logo {
				display: flex;
				width: 2.25rem;
				height: 2.25rem;
				align-items: center;
				justify-content: center;
				border-radius: 0.5rem;
				background: var(--primary, currentColor);
				color: var(--primary-foreground, #fff);
			}
			#splash .splash-bar {
				position: relative;
				width: 10rem;
				height: 3px;
				overflow: hidden;
				border-radius: 999px;
				background: color-mix(in oklab, var(--primary, currentColor) 15%, transparent);
			}
			#splash .splash-bar::after {
				content: "";
				position: absolute;
				inset: 0;
				width: 40%;
				border-radius: inherit;
				background: var(--primary, currentColor);
				animation: splash-bar 1.1s ease-in-out infinite;
			}
			#splash .splash-label {
				position: absolute;
				width: 1px;
				height: 1px;
				overflow: hidden;
				clip-path: inset(50%);
				white-space: nowrap;
			}
			@keyframes splash-in {
				from {
					opacity: 0;
				}
			}
			@keyframes splash-expire {
				to {
					visibility: hidden;
				}
			}
			@keyframes splash-bar {
				from {
					translate: -100% 0;
				}
				to {
					translate: 250% 0;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#splash > * {
					animation: splash-in 0s linear 200ms both;
				}
				html[data-hydrated] #splash,
				html[data-splash-done] #splash {
					transition: none;
				}
				#splash .splash-bar::after {
					animation: none;
					width: 100%;
					opacity: 0.5;
				}
			}
		</style>
		<noscript
			><style>
				#splash {
					display: none;
				}
			</style></noscript
		>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="splash" role="status">
			<div class="splash-brand" aria-hidden="true">
				<div class="splash-logo">
					<svg
						xmlns="http://www.w3.org/2000/svg"
						width="20"
						height="20"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<path d="M12 16h.01" />
						<path d="M16 16h.01" />
						<path
							d="M3 19a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5a.5.5 0 0 0-.769-.422l-4.462 2.844A.5.5 0 0 1 15 10.5v-2a.5.5 0 0 0-.769-.422L9.77 10.922A.5.5 0 0 1 9 10.5V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2z"
						/>
						<path d="M8 16h.01" />
					</svg>
				</div>
				Fieldworks
			</div>
			<div class="splash-bar" aria-hidden="true"></div>
			<span class="splash-label">%splash.label%</span>
		</div>
		<div id="app" style="display: contents">%sveltekit.body%</div>
		<script>
			// Busy until the root layout has mounted (`src/lib/splash.ts`), or the splash gave up.
			(function () {
				var root = document.documentElement;
				if (!("hydrated" in root.dataset) && !("splashDone" in root.dataset)) {
					document.getElementById("app").setAttribute("aria-busy", "true");
				}
			})();
		</script>
	</body>
</html>
