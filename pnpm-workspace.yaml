allowBuilds:
  esbuild: true
  # Cloudflare's runtime, for `wrangler dev`: its postinstall checks for its platform binary.
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.1
  vite-plus: 1.0.0
  "@vitest/browser-playwright": 5.0.1
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
patchedDependencies:
  # `invalidateAll()` reconnects the live queries with `void resource.reconnect()`, whose promise
  # rejects when the page is being left (signing out from the live dashboard): an unhandled
  # rejection. Caught; see docs/upstream-bugs/README.md (9). Drop it once SvelteKit catches it.
  "@sveltejs/kit@3.0.0": patches/@sveltejs__kit@3.0.0.patch
  "@tanstack/svelte-table@9.2.5": patches/@tanstack__svelte-table@9.2.5.patch
  "svelte-sonner@1.2.1": patches/svelte-sonner@1.2.1.patch
  # Hydration skipped past the end of an async block that holds a `<svelte:boundary>` that failed
  # on the server (`skip_nodes` didn't count its `<!--[?…-->` marker as an opening), so the page
  # failed to hydrate; see `extension-slot.svelte`. Still in 5.57.2: drop it once Svelte fixes it.
  # Also: the dev-only "Batch has scheduled effects" invariant warns instead of throwing; thrown
  # mid-commit it froze the page (a module skeleton coming in during the sign-in navigation, see
  # "Skeletons" in AGENTS.md). Production builds skip that check.
  # Also: a derived computed while another batch is pending (a preload fork, an update awaiting a
  # query) stays dirty, and was computed anew on every read, with all it reads: a resize across the
  # sidebar's breakpoint froze the dashboard's charts for 7 s. Now computed once until a dependency
  # changes (`fresh_deriveds`); see docs/upstream-bugs/README.md (10). Still in 5.57.2.
  svelte@5.57.1: patches/svelte@5.57.1.patch
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
