# The checks and the whole test suite on every push (a pull request's included), and once they pass
# the deploy to Cloudflare: main to production, develop to staging (with the demo data). Agents
# run the tests of what they change; this runs everything.
name: CI

on:
  push:
  workflow_dispatch:

# A newer push to the same branch cancels the run it makes obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, knip and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Node, pnpm (package.json's devEngines), the dependency cache and `vp install`.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
      - name: Create .env
        run: |
          sed -e "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=\"$(openssl rand -base64 32)\"|" \
            .env.example > .env
      - run: vp exec playwright install --with-deps chromium
      - run: vp run check
      - run: vp run knip
      - run: vp test run --project 'server-*' --project client

  e2e:
    name: End-to-end tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
      - name: Create .env
        run: |
          sed -e "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=\"$(openssl rand -base64 32)\"|" \
            .env.example > .env
      - run: vp exec playwright install --with-deps chromium
      # A file that fails is run once more on its own (scripts/test.ts).
      - run: vp run test --project e2e --shard=${{ matrix.shard }}/3

  deploy:
    name: Deploy to Cloudflare
    needs: [check, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://fieldworks.devign.workers.dev
    # One deploy at a time.
    concurrency:
      group: deploy-cloudflare
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
      # The Worker's secrets (BETTER_AUTH_SECRET, OPS_TOKEN) are on Cloudflare. The build only checks
      # that the app's required variables are set (src/env.ts) and doesn't keep their values, so a
      # placeholder will do; ORIGIN is the Worker's own (`wrangler.jsonc`), also while the build
      # loads the routes.
      - run: vp run deploy:cloudflare
        env:
          BETTER_AUTH_SECRET: set-on-cloudflare
          ORIGIN: https://fieldworks.devign.workers.dev
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  staging:
    name: Deploy develop to staging
    needs: [check, e2e]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://fieldworks-staging.devign.workers.dev
    concurrency:
      group: deploy-cloudflare-staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
      # As for production, the build only checks that the required variables are set.
      - run: vp run build:cloudflare
        env:
          BETTER_AUTH_SECRET: set-on-cloudflare
          ORIGIN: https://fieldworks-staging.devign.workers.dev
      - run: vp exec wrangler deploy --env staging
      # Staging's own secrets: its auth secret made once (sessions survive the next deploy), an
      # ops token made anew each time, which only this job uses, to import the demo data below.
      - name: Set staging's secrets
        run: |
          if ! vp exec wrangler secret list --env staging --format json | grep -q '"BETTER_AUTH_SECRET"'; then
            openssl rand -base64 32 | vp exec wrangler secret put BETTER_AUTH_SECRET --env staging
          fi
          OPS_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$OPS_TOKEN"
          echo "OPS_TOKEN=$OPS_TOKEN" >> "$GITHUB_ENV"
          printf '%s' "$OPS_TOKEN" | vp exec wrangler secret put OPS_TOKEN --env staging
      # The demo data (README "Demo login"), seeded as locally and imported into staging's
      # Durable Object, replacing what was there.
      - name: Load the demo data
        run: |
          cp .env.example .env
          sed -i -e "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=\"$(openssl rand -base64 32)\"|" .env
          vp run db:reset
          node cloudflare/export-database.ts file:local.db > export.json
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o response.json -w '%{http_code}' -X POST \
              https://fieldworks-staging.devign.workers.dev/_ops/import \
              -H "Authorization: Bearer $OPS_TOKEN" -H "Content-Type: application/json" \
              --data-binary @export.json)
            if [ "$status" = "200" ]; then cat response.json; exit 0; fi
            echo "Import answered $status, trying again"; sleep 10
          done
          cat response.json; exit 1
