# The checks and the whole test suite on every push (a pull request's included), and, on main once
# they pass, the deploy to Cloudflare. Agents run the tests of what they change; this runs everything.
name: CI

on:
  push:
  workflow_dispatch:

# A newer push to the same branch cancels the run it makes obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, knip and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Node, pnpm (package.json's devEngines), the dependency cache and `vp install`.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
      - name: Create .env
        run: |
          sed -e "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=\"$(openssl rand -base64 32)\"|" \
            .env.example > .env
      - run: vp exec playwright install --with-deps chromium
      - run: vp run check
      - run: vp run knip
      - run: vp test run --project 'server-*' --project client

  e2e:
    name: End-to-end tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
      - name: Create .env
        run: |
          sed -e "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=\"$(openssl rand -base64 32)\"|" \
            .env.example > .env
      - run: vp exec playwright install --with-deps chromium
      # A file that fails is run once more on its own (scripts/test.ts).
      - run: vp run test --project e2e --shard=${{ matrix.shard }}/3

  deploy:
    name: Deploy to Cloudflare
    needs: [check, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://fieldworks.devign.workers.dev
    # One deploy at a time.
    concurrency:
      group: deploy-cloudflare
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
      # The Worker's secrets (BETTER_AUTH_SECRET, OPS_TOKEN) are on Cloudflare already; the build
      # reads no .env.
      - run: vp run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
